<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wiki RAG</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 720px;
        margin: 0 auto;
        padding: 16px;
        line-height: 1.5;
      }
      form {
        display: flex;
        gap: 8px;
      }
      input[type="text"] {
        flex: 1;
        padding: 8px;
        font-size: 16px;
      }
      .turn {
        border-top: 1px solid #ddd;
        padding: 12px 0;
      }
      .question {
        font-weight: 600;
      }
      .meta {
        color: #777;
        font-size: 13px;
      }
      .passage {
        margin: 8px 0;
        padding: 8px;
        background: #f6f6f6;
        font-size: 14px;
        white-space: pre-wrap;
      }
      .passage.cited {
        background: #e6f2ff;
      }
      .error {
        color: #c00;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/web/main.tsx"></script>
  </body>
</html>
