<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phone spike</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 720px;
        margin: 0 auto;
        padding: 16px;
        line-height: 1.5;
      }
      form {
        display: flex;
        gap: 8px;
      }
      input[type="text"] {
        flex: 1;
        padding: 8px;
        font-size: 16px;
      }
      #reply {
        white-space: pre-wrap;
      }
      .meta {
        color: #777;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <p id="gpu" class="meta">Checking WebGPU…</p>
    <button id="load" type="button">Load model</button>
    <p id="progress" class="meta"></p>
    <form id="form">
      <input id="prompt" type="text" placeholder="Ask something" disabled />
      <button id="ask" type="submit" disabled>Ask</button>
    </form>
    <p id="reply"></p>
    <p id="stats" class="meta"></p>
    <script type="module" src="/src/web/spike.ts"></script>
  </body>
</html>
